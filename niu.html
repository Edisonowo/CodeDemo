
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 数据全能搜索工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS 用于处理 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .table-container { max-height: 60vh; overflow-y: auto; }
        th { position: sticky; top: 0; background-color: #f9fafb; z-index: 10; }
        .highlight { background-color: #fef3c7; font-weight: bold; color: #d97706; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-6xl rounded-2xl p-8">
        <!-- 头部标题 -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📊 Excel 数据全能搜索工具</h1>
            <p class="text-gray-500">支持多文件、多 Sheet 模糊搜索与结果导出</p>
        </div>

        <!-- 控制区域 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-8">
            <!-- 文件选择 -->
            <div class="md:col-span-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">1. 选择数据源 (B, C, D...)</label>
                <input type="file" id="fileInput" multiple accept=".xlsx, .xls" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
            </div>

            <!-- 搜索框 -->
            <div class="md:col-span-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">2. 输入搜索关键字</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="例如：8i29cby1cwnnk1q" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-sm"/>
                    <button onclick="performSearch()" 
                        class="absolute right-2 top-2 bg-blue-600 text-white px-4 py-1.5 rounded-md hover:bg-blue-700 transition-colors text-sm font-medium">
                        搜索
                    </button>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="md:col-span-2 flex items-end">
                <button onclick="exportResults()" id="exportBtn" disabled
                    class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed font-medium flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    下载结果
                </button>
            </div>
        </div>

        <!-- 状态提示 -->
        <div id="statusMsg" class="mb-4 text-sm text-gray-600 hidden"></div>

        <!-- 结果展示区 -->
        <div class="border rounded-xl overflow-hidden bg-white shadow-inner">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-semibold text-gray-700">搜索结果预览</h3>
                <span id="resultCount" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">0 条记录</span>
            </div>
            <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200" id="resultTable">
                    <thead class="bg-gray-50" id="tableHead">
                        <!-- 动态表头 -->
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                                请上传文件并输入关键字开始搜索...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allData = []; // 存储所有解析后的数据
        let searchResults = []; // 存储搜索结果

        // 监听文件上传
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            showStatus(`正在解析 ${files.length} 个文件...`, 'text-blue-600');
            allData = []; // 重置数据

            for (let i = 0; i < files.length; i++) {
                const data = await readExcelFile(files[i]);
                allData = allData.concat(data);
            }

            showStatus(`✅ 成功加载 ${allData.length} 行数据。现在可以搜索了。`, 'text-green-600');
        });

        // 读取单个 Excel 文件
        function readExcelFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const rows = [];

                    // 遍历所有 Sheet
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        // 转换为 JSON，第一行为表头
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        if (jsonData.length > 1) {
                            const headers = jsonData[0];
                            for (let i = 1; i < jsonData.length; i++) {
                                const rowObj = {
                                    _sourceFile: file.name,
                                    _sheetName: sheetName,
                                    _originalRow: jsonData[i] // 保留原始数组用于导出
                                };
                                // 将每一列映射到对象中，方便搜索
                                headers.forEach((header, index) => {
                                    rowObj[header || `Column${index}`] = jsonData[i][index];
                                });
                                rows.push(rowObj);
                            }
                        }
                    });
                    resolve(rows);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // 执行搜索
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) {
                alert("请输入搜索关键字");
                return;
            }
            if (allData.length === 0) {
                alert("请先上传 Excel 文件");
                return;
            }

            searchResults = allData.filter(row => {
                // 遍历该行的所有值，检查是否包含关键字
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(keyword)
                );
            });

            renderTable(searchResults, keyword);
            document.getElementById('exportBtn').disabled = searchResults.length === 0;
        }

        // 渲染表格
        function renderTable(data, keyword) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const countSpan = document.getElementById('resultCount');

            countSpan.innerText = `${data.length} 条记录`;
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">未找到匹配的数据</td></tr>`;
                return;
            }

            // 生成表头 (取第一条数据的键，排除内部字段)
            const keys = Object.keys(data[0]).filter(k => !k.startsWith('_'));
            let headerHtml = '<tr>';
            headerHtml += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">来源文件</th>';
            headerHtml += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sheet名</th>';
            keys.forEach(key => {
                headerHtml += `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${key}</th>`;
            });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // 生成内容
            data.forEach(row => {
                let rowHtml = '<tr class="hover:bg-gray-50 transition-colors">';
                rowHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row._sourceFile}</td>`;
                rowHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row._sheetName}</td>`;
                
                keys.forEach(key => {
                    let cellValue = String(row[key] || '');
                    // 简单的高亮逻辑
                    if (keyword && cellValue.toLowerCase().includes(keyword)) {
                        const regex = new RegExp(`(${keyword})`, 'gi');
                        cellValue = cellValue.replace(regex, '<span class="highlight">$1</span>');
                    }
                    rowHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${cellValue}</td>`;
                });
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            });
        }

        // 导出结果
        function exportResults() {
            if (searchResults.length === 0) return;

            // 准备导出数据，去掉内部字段
            const exportData = searchResults.map(row => {
                const newRow = {};
                newRow['来源文件'] = row._sourceFile;
                newRow['Sheet名称'] = row._sheetName;
                Object.keys(row).forEach(key => {
                    if (!key.startsWith('_')) {
                        newRow[key] = row[key];
                    }
                });
                return newRow;
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "搜索结果");
            XLSX.writeFile(wb, `搜索导出_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function showStatus(msg, colorClass) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = `mb-4 text-sm font-medium ${colorClass}`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
