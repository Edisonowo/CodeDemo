
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能分词深度搜索工具 (修复版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .highlight-text {
            background-color: #fef08a;
            color: #b45309;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 700;
        }
        .keyword-tag {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-right: 4px;
            margin-bottom: 4px;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="glass-panel w-full max-w-7xl rounded-xl p-8 mb-8">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">🔍 智能分词深度搜索器</h1>
                <p class="text-slate-500 text-sm mt-1">自动识别中文单字与连续数字/字母，执行多条件 AND 匹配</p>
            </div>
            <span id="fileCountBadge" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-medium">未选择文件</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <div class="lg:col-span-12">
                <label class="block text-sm font-semibold text-slate-700 mb-2">📂 第一步：选择数据源 (B/C/D...)</label>
                <input type="file" id="fileInput" multiple accept=".xlsx, .xls" 
                    class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-lg bg-white transition-all"/>
            </div>

            <div class="lg:col-span-9">
                <label class="block text-sm font-semibold text-slate-700 mb-2">🔍 第二步：输入长文本 (自动分词)</label>
                <textarea id="searchInput" rows="3" placeholder="例如：请查找用户 张三 在 2026年 的订单 8i29cby1cwnnk1q..." 
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm"></textarea>
            </div>

            <div class="lg:col-span-3 flex flex-col gap-2 justify-end">
                <button onclick="startSmartSearch()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-lg font-medium shadow-md transition-all flex items-center justify-center gap-2">
                    开始智能搜索
                </button>
                <button onclick="exportToExcel()" id="exportBtn" disabled
                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium shadow-md transition-all">
                    导出结果
                </button>
            </div>
        </div>

        <div id="keywordPreview" class="hidden mb-4 p-3 bg-slate-50 rounded-lg border border-slate-200">
            <span class="text-xs font-bold text-slate-500 uppercase mr-2">识别到的搜索条件 (AND):</span>
            <div id="keywordTags" class="inline-block"></div>
        </div>

        <div id="statusArea" class="hidden mb-4 p-3 rounded-lg text-sm flex items-center gap-2"></div>

        <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200" id="resultTable">
                    <thead class="bg-slate-50" id="tableHead"></thead>
                    <tbody class="bg-white divide-y divide-slate-100" id="tableBody">
                        <tr><td colspan="10" class="px-6 py-16 text-center text-slate-400">等待搜索...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalResults = []; 

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const count = e.target.files.length;
            document.getElementById('fileCountBadge').innerText = `已选 ${count} 个文件`;
            document.getElementById('fileCountBadge').className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-medium";
        });

        // ✅ 核心：智能分词函数
        function extractKeywords(text) {
            if (!text) return [];
            const keywords = [];
            const regex = /[\u4e00-\u9fa5]|[a-zA-Z0-9]+/g;
            const matches = text.match(regex);
            
            if (matches) {
                matches.forEach(match => {
                    if (/[\u4e00-\u9fa5]/.test(match)) {
                        for (let char of match) keywords.push(char);
                    } else {
                        keywords.push(match);
                    }
                });
            }
            return [...new Set(keywords)].filter(k => k.length > 0);
        }

        async function startSmartSearch() {
            const files = document.getElementById('fileInput').files;
            const rawText = document.getElementById('searchInput').value;
            const keywords = extractKeywords(rawText);

            console.log("开始搜索，关键词:", keywords); // 调试日志

            if (files.length === 0) { alert("请先选择 Excel 文件！"); return; }
            if (keywords.length === 0) { alert("未识别到有效的中文或数字关键词！"); return; }

            // UI 更新
            const previewDiv = document.getElementById('keywordPreview');
            const tagsDiv = document.getElementById('keywordTags');
            previewDiv.classList.remove('hidden');
            tagsDiv.innerHTML = keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('');

            showStatus(true, `正在扫描 ${files.length} 个文件...`);
            globalResults = []; 

            try {
                for (let i = 0; i < files.length; i++) {
                    console.log(`正在处理文件: ${files[i].name}`);
                    await processFile(files[i], keywords);
                }
                
                console.log(`搜索完成，共找到 ${globalResults.length} 条结果`);
                renderResults(globalResults, keywords);
                showStatus(false, `扫描完成！找到 ${globalResults.length} 条记录。`, "success");
                document.getElementById('exportBtn').disabled = globalResults.length === 0;
            } catch (err) {
                console.error("搜索过程中发生错误:", err);
                showStatus(false, `搜索出错: ${err.message}`, "error");
            }
        }

        function processFile(file, keywords) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onerror = () => reject(new Error(`文件读取失败: ${file.name}`));
                
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            // header: 1 返回二维数组，defval: "" 确保空单元格也有值
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                            
                            if (jsonData.length < 2) return;
                            const headers = jsonData[0];
                            
                            for (let i = 1; i < jsonData.length; i++) {
                                const rowArray = jsonData[i];
                                // 将整行转为字符串进行匹配
                                const rowString = rowArray.join(" ").toLowerCase();
                                
                                // AND 逻辑
                                const isMatch = keywords.every(kw => rowString.includes(kw.toLowerCase()));
                                
                                if (isMatch) {
                                    globalResults.push({
                                        _sourceFile: file.name,
                                        _sheetName: sheetName,
                                        _headers: headers,
                                        _rowData: rowArray
                                    });
                                }
                            }
                        });
                        resolve(); // 成功处理完一个文件
                    } catch (innerErr) {
                        reject(innerErr);
                    }
                };
                
                reader.readAsArrayBuffer(file);
            });
        }

        function renderResults(results, keywords) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">未找到同时包含这些关键词的数据行</td></tr>`;
                return;
            }

            // 动态表头
            let dynamicHeaders = results[0]._headers.slice(0, 15); 
            let headerHtml = `
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-0 z-10 border-r w-32">来源</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-[128px] z-10 border-r w-32">Sheet</th>
            `;
            dynamicHeaders.forEach(h => {
                headerHtml += `<th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap min-w-[100px]">${h || '...'}</th>`;
            });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // 渲染行
            results.forEach(item => {
                let rowHtml = `<tr class="hover:bg-indigo-50 transition-colors group">`;
                rowHtml += `<td class="px-4 py-3 text-xs text-slate-600 font-medium border-r bg-white group-hover:bg-indigo-50 sticky left-0 truncate max-w-[120px]" title="${item._sourceFile}">${item._sourceFile}</td>`;
                rowHtml += `<td class="px-4 py-3 text-xs text-slate-500 border-r bg-white group-hover:bg-indigo-50 sticky left-[128px]">${item._sheetName}</td>`;

                item._rowData.forEach(cellData => {
                    let cellStr = String(cellData === undefined ? "" : cellData);
                    let displayStr = cellStr;

                    keywords.forEach(kw => {
                        if (kw && cellStr.toLowerCase().includes(kw.toLowerCase())) {
                            const regex = new RegExp(`(${kw})`, 'gi');
                            displayStr = displayStr.replace(regex, '<span class="highlight-text">$1</span>');
                        }
                    });

                    rowHtml += `<td class="px-4 py-3 text-sm text-slate-700 whitespace-nowrap max-w-xs truncate" title="${cellData}">${displayStr}</td>`;
                });
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            });
        }

        function exportToExcel() {
            if (globalResults.length === 0) return;
            const exportRows = globalResults.map(item => {
                const rowObj = { "来源文件": item._sourceFile, "Sheet名称": item._sheetName };
                item._headers.forEach((header, index) => {
                    const colName = header || `Column_${index+1}`;
                    rowObj[colName] = item._rowData[index];
                });
                return rowObj;
            });
            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "智能搜索结果");
            XLSX.writeFile(wb, `智能搜索导出_${new Date().getTime()}.xlsx`);
        }

        function showStatus(isLoading, msg, type = "info") {
            const el = document.getElementById('statusArea');
            el.classList.remove('hidden');
            if (isLoading) {
                el.className = "mb-4 p-3 rounded-lg bg-blue-50 text-blue-700 text-sm flex items-center gap-2";
                el.innerHTML = `<svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ${msg}`;
            } else {
                el.className = `mb-4 p-3 rounded-lg text-sm flex items-center gap-2 ${type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`;
                el.innerText = msg;
            }
        }
    </script>
</body>
</html>
