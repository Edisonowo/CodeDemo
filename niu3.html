
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 多关键词深度搜索工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f5f9; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .highlight-text {
            background-color: #fef08a;
            color: #854d0e;
            padding: 0 3px;
            border-radius: 3px;
            font-weight: 700;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .input-group:focus-within label { color: #2563eb; }
        .input-group:focus-within input { border-color: #2563eb; ring: 2px; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="glass-panel w-full max-w-7xl rounded-xl p-8 mb-8">
        <!-- 标题区 -->
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    Excel 多关键词精准搜索器
                </h1>
                <p class="text-slate-500 text-sm mt-1">支持 AND 逻辑：仅展示同时包含所有已填关键词的完整行</p>
            </div>
            <div class="text-right">
                <span id="fileCountBadge" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-medium">未选择文件</span>
            </div>
        </div>

        <!-- 操作区 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <!-- 1. 文件上传 -->
            <div class="lg:col-span-12 mb-2">
                <label class="block text-sm font-semibold text-slate-700 mb-2">📂 第一步：选择数据源 (支持 B/C/D 等多文件)</label>
                <input type="file" id="fileInput" multiple accept=".xlsx, .xls" 
                    class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-lg bg-white transition-all"/>
            </div>

            <!-- 2. 三关键词输入 -->
            <div class="lg:col-span-9 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="input-group">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">关键词 1 (必填)</label>
                    <input type="text" id="kw1" placeholder="例如：ID号" class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:border-blue-500 transition-colors"/>
                </div>
                <div class="input-group">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">关键词 2 (可选)</label>
                    <input type="text" id="kw2" placeholder="例如：姓名" class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:border-blue-500 transition-colors"/>
                </div>
                <div class="input-group">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">关键词 3 (可选)</label>
                    <input type="text" id="kw3" placeholder="例如：日期" class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:border-blue-500 transition-colors"/>
                </div>
            </div>

            <!-- 3. 按钮组 -->
            <div class="lg:col-span-3 flex gap-2 items-end">
                <button onclick="startSearch()" 
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-md transition-all active:scale-95">
                    🔍 搜索
                </button>
                <button onclick="exportToExcel()" id="exportBtn" disabled
                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium shadow-md transition-all">
                    📥 导出
                </button>
            </div>
        </div>

        <!-- 状态栏 -->
        <div id="statusArea" class="hidden mb-4 p-3 rounded-lg bg-blue-50 text-blue-700 text-sm flex items-center gap-2">
            <span id="statusText">正在处理...</span>
        </div>

        <!-- 结果展示区 -->
        <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200" id="resultTable">
                    <thead class="bg-slate-50" id="tableHead"></thead>
                    <tbody class="bg-white divide-y divide-slate-100" id="tableBody">
                        <tr>
                            <td colspan="10" class="px-6 py-16 text-center text-slate-400">
                                请填写关键词并点击搜索
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalResults = []; 

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const count = e.target.files.length;
            document.getElementById('fileCountBadge').innerText = `已选 ${count} 个文件`;
            document.getElementById('fileCountBadge').className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-medium";
        });

        async function startSearch() {
            const files = document.getElementById('fileInput').files;
            // 获取三个关键词，过滤掉空的
            const keywords = [
                document.getElementById('kw1').value.trim(),
                document.getElementById('kw2').value.trim(),
                document.getElementById('kw3').value.trim()
            ].filter(k => k !== "");

            if (files.length === 0) { alert("请先选择 Excel 文件！"); return; }
            if (keywords.length === 0) { alert("请至少填写一个关键词！"); return; }

            showStatus(true, `正在使用 ${keywords.length} 个关键词进行深度扫描...`);
            globalResults = []; 

            try {
                for (let i = 0; i < files.length; i++) {
                    await processFile(files[i], keywords);
                }
                
                renderResults(globalResults, keywords);
                showStatus(false, `扫描完成！找到 ${globalResults.length} 条同时包含所有关键词的记录。`, "success");
                document.getElementById('exportBtn').disabled = globalResults.length === 0;
            } catch (err) {
                console.error(err);
                showStatus(false, "处理出错，请检查文件格式。", "error");
            }
        }

        // 处理单个文件
        function processFile(file, keywords) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        if (jsonData.length < 2) return;

                        const headers = jsonData[0];
                        
                        for (let i = 1; i < jsonData.length; i++) {
                            const rowArray = jsonData[i];
                            const rowString = rowArray.join(" ").toLowerCase();
                            
                            // ✅ 核心逻辑：AND 搜索
                            // 只有当这一行字符串包含了【每一个】关键词时，才算匹配
                            const isMatch = keywords.every(kw => rowString.includes(kw.toLowerCase()));
                            
                            if (isMatch) {
                                globalResults.push({
                                    _sourceFile: file.name,
                                    _sheetName: sheetName,
                                    _headers: headers,
                                    _rowData: rowArray
                                });
                            }
                        }
                    });
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderResults(results, keywords) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">未找到同时包含这些关键词的数据行</td></tr>`;
                return;
            }

            // 动态表头
            let dynamicHeaders = results[0]._headers.slice(0, 15); 
            let headerHtml = `
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-0 z-10 border-r w-32">来源</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-[128px] z-10 border-r w-32">Sheet</th>
            `;
            dynamicHeaders.forEach(h => {
                headerHtml += `<th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap min-w-[100px]">${h || '...'}</th>`;
            });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // 渲染行
            results.forEach(item => {
                let rowHtml = `<tr class="hover:bg-blue-50 transition-colors group">`;
                rowHtml += `<td class="px-4 py-3 text-xs text-slate-600 font-medium border-r bg-white group-hover:bg-blue-50 sticky left-0 truncate max-w-[120px]" title="${item._sourceFile}">${item._sourceFile}</td>`;
                rowHtml += `<td class="px-4 py-3 text-xs text-slate-500 border-r bg-white group-hover:bg-blue-50 sticky left-[128px]">${item._sheetName}</td>`;

                item._rowData.forEach(cellData => {
                    let cellStr = String(cellData === undefined ? "" : cellData);
                    let displayStr = cellStr;

                    // 多关键词高亮逻辑
                    keywords.forEach(kw => {
                        if (kw && cellStr.toLowerCase().includes(kw.toLowerCase())) {
                            const regex = new RegExp(`(${kw})`, 'gi');
                            displayStr = displayStr.replace(regex, '<span class="highlight-text">$1</span>');
                        }
                    });

                    rowHtml += `<td class="px-4 py-3 text-sm text-slate-700 whitespace-nowrap max-w-xs truncate" title="${cellData}">${displayStr}</td>`;
                });
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            });
        }

        function exportToExcel() {
            if (globalResults.length === 0) return;

            const exportRows = globalResults.map(item => {
                const rowObj = { "来源文件": item._sourceFile, "Sheet名称": item._sheetName };
                item._headers.forEach((header, index) => {
                    const colName = header || `Column_${index+1}`;
                    rowObj[colName] = item._rowData[index];
                });
                return rowObj;
            });

            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "多条件搜索结果");
            XLSX.writeFile(wb, `精准搜索导出_${new Date().getTime()}.xlsx`);
        }

        function showStatus(isLoading, msg, type = "info") {
            const el = document.getElementById('statusArea');
            const txt = document.getElementById('statusText');
            if (!isLoading) {
                el.classList.remove('hidden', 'bg-blue-50', 'text-blue-700');
                el.classList.add(type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
            } else {
                el.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');
                el.classList.add('bg-blue-50', 'text-blue-700');
            }
            txt.innerText = msg;
        }
    </script>
</body>
</html>
