<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 全量数据搜索与导出工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .highlight-text {
            background-color: #fef08a; /* 黄色高亮 */
            color: #854d0e;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="glass-panel w-full max-w-7xl rounded-xl p-8 mb-8">
        <!-- 标题区 -->
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    Excel 多表全能搜索器
                </h1>
                <p class="text-slate-500 text-sm mt-1">支持多文件、多 Sheet 深度检索，自动保留完整行数据</p>
            </div>
            <div class="text-right">
                <span id="fileCountBadge" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-medium">未选择文件</span>
            </div>
        </div>

        <!-- 操作区 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
            <!-- 1. 文件上传 -->
            <div class="lg:col-span-4">
                <label class="block text-sm font-semibold text-slate-700 mb-2">📂 第一步：选择数据源 </label>
                <div class="relative group">
                    <input type="file" id="fileInput" multiple accept=".xlsx, .xls" 
                        class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-lg bg-white transition-all"/>
                </div>
            </div>

            <!-- 2. 搜索输入 -->
            <div class="lg:col-span-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">🔍 第二步：输入关键字</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="输入 ID、品名或任何内容..." 
                        class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none shadow-sm transition-all"/>
                    <button onclick="startSearch()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-md transition-all active:scale-95">
                        开始搜索
                    </button>
                </div>
            </div>

            <!-- 3. 导出按钮 -->
            <div class="lg:col-span-2 flex items-end">
                <button onclick="exportToExcel()" id="exportBtn" disabled
                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-4 py-2.5 rounded-lg font-medium shadow-md transition-all flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    导出结果
                </button>
            </div>
        </div>

        <!-- 状态栏 -->
        <div id="statusArea" class="hidden mb-4 p-3 rounded-lg bg-blue-50 text-blue-700 text-sm flex items-center gap-2">
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span id="statusText">正在处理...</span>
        </div>

        <!-- 结果展示区 -->
        <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200" id="resultTable">
                    <thead class="bg-slate-50" id="tableHead">
                        <!-- 动态表头 -->
                    </thead>
                    <tbody class="bg-white divide-y divide-slate-100" id="tableBody">
                        <tr>
                            <td colspan="10" class="px-6 py-16 text-center text-slate-400">
                                <div class="flex flex-col items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                    <span>请上传文件并点击搜索</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalResults = []; // 存储最终搜索结果对象
        let loadedFilesCount = 0;

        // 监听文件选择
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const count = e.target.files.length;
            document.getElementById('fileCountBadge').innerText = `已选 ${count} 个文件`;
            document.getElementById('fileCountBadge').className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-medium";
            loadedFilesCount = count;
        });

        async function startSearch() {
            const files = document.getElementById('fileInput').files;
            const keyword = document.getElementById('searchInput').value.trim();

            if (files.length === 0) { alert("请先选择 Excel 文件！"); return; }
            if (!keyword) { alert("请输入搜索关键字！"); return; }

            showStatus(true, "正在深度扫描所有 Sheet...");
            globalResults = []; // 清空旧结果

            try {
                for (let i = 0; i < files.length; i++) {
                    await processFile(files[i], keyword);
                }
                
                renderResults(globalResults, keyword);
                showStatus(false, `扫描完成！共找到 ${globalResults.length} 条匹配记录。`, "success");
                document.getElementById('exportBtn').disabled = globalResults.length === 0;
            } catch (err) {
                console.error(err);
                showStatus(false, "处理出错，请检查文件格式。", "error");
            }
        }

        // 处理单个文件
        function processFile(file, keyword) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 遍历该文件下的所有 Sheet
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        // 转换为二维数组，保留原始结构
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        if (jsonData.length < 2) return; // 跳过空表或只有表头的表

                        const headers = jsonData[0]; // 第一行作为表头
                        
                        // 从第二行开始遍历数据
                        for (let i = 1; i < jsonData.length; i++) {
                            const rowArray = jsonData[i];
                            // 将数组转为字符串进行模糊匹配
                            const rowString = rowArray.join(" ").toLowerCase();
                            
                            if (rowString.includes(keyword.toLowerCase())) {
                                // ✅ 核心逻辑：如果匹配，保存整行数据及元信息
                                globalResults.push({
                                    _sourceFile: file.name,
                                    _sheetName: sheetName,
                                    _headers: headers, // 保存该 Sheet 的表头
                                    _rowData: rowArray // 保存该行的完整原始数据
                                });
                            }
                        }
                    });
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // 渲染结果表格
        function renderResults(results, keyword) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">未找到包含 "${keyword}" 的数据行</td></tr>`;
                return;
            }

            // 1. 构建表头 (固定前两列 + 动态列)
            // 注意：由于不同 Sheet 表头可能不同，这里我们取第一个结果的表头作为预览参考，
            // 但在导出时会处理所有列。为了展示美观，我们动态生成表头。
            let dynamicHeaders = results[0]._headers.slice(0, 10); // 预览只显示前10列
            
            let headerHtml = `
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-0 z-10 border-r">来源文件</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 sticky left-[100px] z-10 border-r">Sheet名</th>
            `;
            dynamicHeaders.forEach(h => {
                headerHtml += `<th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">${h || '空列'}</th>`;
            });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // 2. 构建内容行
            results.forEach(item => {
                let rowHtml = `<tr class="hover:bg-blue-50 transition-colors group">`;
                
                // 固定列
                rowHtml += `<td class="px-4 py-3 text-sm text-slate-600 font-medium border-r bg-white group-hover:bg-blue-50 sticky left-0">${item._sourceFile}</td>`;
                rowHtml += `<td class="px-4 py-3 text-sm text-slate-500 border-r bg-white group-hover:bg-blue-50 sticky left-[100px]">${item._sheetName}</td>`;

                // 动态数据列 (带高亮)
                item._rowData.forEach(cellData => {
                    let cellStr = String(cellData === undefined ? "" : cellData);
                    // 高亮关键字
                    if (keyword && cellStr.toLowerCase().includes(keyword.toLowerCase())) {
                        const regex = new RegExp(`(${keyword})`, 'gi');
                        cellStr = cellStr.replace(regex, '<span class="highlight-text">$1</span>');
                    }
                    rowHtml += `<td class="px-4 py-3 text-sm text-slate-700 whitespace-nowrap max-w-xs truncate" title="${cellData}">${cellStr}</td>`;
                });
                
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            });
        }

        // 导出功能
        function exportToExcel() {
            if (globalResults.length === 0) return;

            // 准备导出数据：将所有不同结构的行合并到一个大表中
            // 为了整齐，我们以“出现次数最多的表头”或者“第一个文件的表头”为基准？
            // 更好的做法：直接导出所有列，如果列数不同，Excel 会自动留空。
            
            const exportRows = globalResults.map(item => {
                const rowObj = {
                    "来源文件": item._sourceFile,
                    "Sheet名称": item._sheetName
                };
                
                // 将该行的数据按表头映射到对象中
                item._headers.forEach((header, index) => {
                    const colName = header || `未命名列${index+1}`;
                    rowObj[colName] = item._rowData[index];
                });
                
                return rowObj;
            });

            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "搜索结果汇总");
            
            // 自动生成文件名
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
            XLSX.writeFile(wb, `搜索导出_${dateStr}.xlsx`);
        }

        function showStatus(isLoading, msg, type = "info") {
            const el = document.getElementById('statusArea');
            const txt = document.getElementById('statusText');
            
            if (!isLoading) {
                el.classList.remove('hidden', 'bg-blue-50', 'text-blue-700');
                if (type === "success") {
                    el.classList.add('bg-green-50', 'text-green-700');
                } else if (type === "error") {
                    el.classList.add('bg-red-50', 'text-red-700');
                } else {
                    el.classList.add('hidden');
                    return;
                }
            } else {
                el.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');
                el.classList.add('bg-blue-50', 'text-blue-700');
            }
            txt.innerText = msg;
        }
    </script>
</body>
</html>
